schema_version: 1
kind: recipe
id: dsv4-tp4-dspark-k5-native-draft-graph-c32
description: TP4 DSpark with target and draft CUDA Graph token sizes covering the
  baseline request batch sizes through C32
provenance: 'Local diagnostic adaptation of upstream #49133; image unchanged; see
  patches/dspark-native-mxfp4/manifest.json'
compatible:
  engine: vllm
  models:
  - dsv4-flash-nvfp4
  compute_capabilities:
  - '12.0'
  runtime_versions:
  - 0.29.0
mode: performance
flags:
- trust-remote-code
- enable-auto-tool-choice
- no-enable-prefix-caching
- no-enable-expert-parallel
- enable-chunked-prefill
- jit-monitor-verbose
- async-scheduling
options:
  tensor-parallel-size: 4
  pipeline-parallel-size: 1
  data-parallel-size: 1
  max-model-len: 16384
  max-num-seqs: 32
  max-num-batched-tokens: 8192
  gpu-memory-utilization: 0.9
  kv-cache-dtype: fp8_e4m3
  block-size: 256
  attention-config:
    use_fp4_indexer_cache: false
    backend: FLASHINFER_MLA_SPARSE_DSV4
  moe-backend: auto
  tokenizer-mode: deepseek_v4
  tool-call-parser: deepseek_v4
  reasoning-parser: deepseek_v4
  reasoning-config:
    reasoning_parser: deepseek_v4
    reasoning_start_str: ''
    reasoning_end_str: ''
  kernel-config:
    enable_flashinfer_autotune: false
  compilation-config:
    cudagraph_mode: FULL_DECODE_ONLY
    cudagraph_capture_sizes:
    - 5
    - 6
    - 10
    - 12
    - 20
    - 24
    - 40
    - 48
    - 60
    - 72
    - 80
    - 96
    - 120
    - 144
    - 160
    - 192
    max_cudagraph_capture_size: 192
  seed: 0
  distributed-executor-backend: mp
  speculative-config:
    method: dspark
    num_speculative_tokens: 5
    draft_sample_method: greedy
    rejection_sample_method: standard
    enable_adaptive_verification: false
checks:
  required:
  - DeepseekV4ForCausalLM
  - FLASHINFER_MLA_SPARSE_DSV4
  - FLASHINFER_CUTLASS
  - DeepSeek V4 expert_dtype resolved to 'fp4'
  - fp8_ds_mla
  - Skipping FlashInfer autotune because it is disabled
  - Warming up DeepSeek V4 sparse MLA attention for mixed tokens=16\.
  - Using V2 Model Runner
  - 'LOCAL_DSPARK_FORMAT_FIX: validated 768 native MXFP4 draft experts'
  - Mxfp4 MoE backend
  warnings:
  - (?i)warning
  - not supported
  - not available
  - disabled
  - scaling factors
  compilation:
  - TileLang (?:begins|completes) to compile kernel
  - (?:^|\s)(?:\S*/)?nvcc\s.*(?:\s-c\s|\s--compile\s)
probe:
  prompt: 请用一句简短中文回答：1加1等于几？
  max_tokens: 64
  request:
    chat_template_kwargs:
      thinking: false
  expect_regex: 2|二|两
environment:
  TILELANG_CACHE_DIR: /root/.cache/tilelang
  VLLM_USE_V2_MODEL_RUNNER: '1'
  PYTHONPATH: /root/.cache/dspark-native-mxfp4

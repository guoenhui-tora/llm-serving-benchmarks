schema_version: 1
kind: target
id: rtx6000d-48-tp4-baseline
description: 'Exclusive TP4 reference: GPU4-7, 16 service cores in NUMA2, 4 client
  cores in NUMA3, one thread per core.'
executor: docker
address: 10.90.1.48
gpus:
- 4
- 5
- 6
- 7
gpu:
  vendor: nvidia
  name_regex: RTX 6000D
  compute_capability: '12.0'
  min_memory_mib: 80000
model_root: /data/models
cache_root: ~/.cache/serving-bench
port: 31248
environment:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
ulimits:
  memlock: -1:-1
  stack: 67108864:67108864
cap_add:
- SYS_NICE
binding:
  server:
    cpus: 32-47
    mems: '2'
  client:
    cpus: 48-51
    mems: '3'

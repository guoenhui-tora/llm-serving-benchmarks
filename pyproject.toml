[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serving-benchmarks"
version = "0.1.0"
description = "Reproducible, configuration-driven LLM serving experiments"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
bench = "serving_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

schema_version: 1
kind: recipe
id: glm52-vllm-sm120-performance
description: UNVALIDATED performance candidate. Enable default optimization paths,
  then validate on the target before interpreting measurements.
provenance: https://recipes.vllm.ai/zai-org/GLM-5.2 ; adapted to SM120 PCIe using
  prior local smoke logs.
compatible:
  engine: vllm
  models:
  - glm52-nvfp4
  compute_capabilities:
  - '12.0'
  runtime_versions:
  - 0.29.0
mode: performance
flags:
- enable-expert-parallel
- trust-remote-code
- enable-auto-tool-choice
- no-enable-prefix-caching
options:
  tensor-parallel-size: 8
  reasoning-parser: glm45
  tool-call-parser: glm47
  kv-cache-dtype: fp8_e4m3
  max-model-len: 16384
  max-num-seqs: 32
  max-num-batched-tokens: 8192
  gpu-memory-utilization: 0.9
checks:
  required:
  - GlmMoeDsaForCausalLM
  - FLASHINFER_MLA_SPARSE_SM120
  - FLASHINFER_CUTLASS
  warnings:
  - (?i)warning
  - not supported
  - not available
  - disabled
probe:
  prompt: 请用一句简短中文回答：1加1等于几？
  max_tokens: 64
  request:
    chat_template_kwargs:
      enable_thinking: false
  expect_regex: 2|二|两

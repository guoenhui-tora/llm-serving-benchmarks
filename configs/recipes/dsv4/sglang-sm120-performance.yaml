schema_version: 1
kind: recipe
id: dsv4-sglang-sm120-performance
description: UNVALIDATED performance candidate. Enable default optimization paths,
  then validate on the target before interpreting measurements.
provenance: https://docs.sglang.io/cookbook/autoregressive/DeepSeek/DeepSeek-V4 ;
  adapted to SM120 PCIe using prior local smoke logs.
compatible:
  engine: sglang
  models:
  - dsv4-flash-nvfp4
  compute_capabilities:
  - '12.0'
  runtime_versions:
  - 0.5.19
mode: performance
flags:
- trust-remote-code
- disable-shared-experts-fusion
- disable-radix-cache
options:
  tp-size: 8
  context-length: 16384
  max-running-requests: 32
  mem-fraction-static: 0.75
  kv-cache-dtype: fp8_e4m3
  moe-runner-backend: flashinfer_cutlass
  chunked-prefill-size: 4096
  swa-full-tokens-ratio: 0.1
  tool-call-parser: deepseekv4
  reasoning-parser: deepseek-v4
checks:
  required:
  - DeepseekV4ForCausalLM
  - DeepseekV4AttnBackend
  - ModelOptNvFp4FusedMoEMethod
  - moe_runner_backend=flashinfer_cutlass
  warnings:
  - (?i)warning
  - not supported
  - not available
  - disabled
  - scaling factors
probe:
  prompt: 请用一句简短中文回答：1加1等于几？
  max_tokens: 64
  request:
    chat_template_kwargs:
      thinking: false
  expect_regex: 2|二|两
